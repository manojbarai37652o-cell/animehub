<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeNest - Watch Anime Free</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AnimeNest">
    
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AnimeNest" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);">
        </div>
        <div class="splash-spinner"></div>
        <p class="splash-text">Loading your anime...</p>
    </div>

    <!-- SPA Top Loading Bar -->
    <div id="spaLoader" class="spa-loader"></div>

    <!-- Floating Glass Header -->
    <div class="header-wrapper">
        <header class="glass-header">
            <div class="logo-left">
                <a href="/" class="logo-link spa-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                    <!-- 🛠️ HEADER LOGO: Inline style se fix kiya -->
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AnimeNest Logo" style="height: 38px; width: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); display: block;">
                    <span class="logo-text" style="font-size: 20px; font-weight: 800; color: #fff;">Anime<span style="color: #a855f7;">Nest</span></span>
                </a>
            </div>

            <div class="header-right-icons" style="display: flex; align-items: center; gap: 10px;">
                <a href="javascript:void(0)" onclick="openSearch()" class="glass-icon-btn" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;"><i class="fas fa-search"></i></a>
                <a href="#" class="glass-icon-btn bell-icon" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative;">
                    <i class="fas fa-bell"></i>
                    <span class="notification-dot"></span>
                </a>
                
                <!-- 🛠️ PROFILE ICON: Inline style se fix kiya (overflow hidden) -->
                {% if session.user_pic %}
                <a href="/profile" class="glass-icon-btn profile-icon spa-link" style="width: 40px; height: 40px; min-width: 40px; min-height: 40px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0; text-decoration: none;">
                    <img src="{{ session.user_pic }}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;">
                </a>
                {% else %}
                <a href="/profile" class="glass-icon-btn spa-link" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;"><i class="fas fa-user"></i></a>
                {% endif %}
            </div>
        </header>
    </div>

    <!-- Search Overlay -->
    <div id="searchOverlay" class="search-overlay">
        <div class="search-overlay-content">
            <form action="/search" method="GET" class="search-form-overlay">
                <i class="fas fa-search search-icon-overlay"></i>
                <input type="text" name="q" id="searchInput" placeholder="Search anime, movies..." autocomplete="off">
                <button type="button" class="close-search-btn" onclick="closeSearch()"><i class="fas fa-times"></i></button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="spaContent">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Nav -->
    <div class="bottom-nav-wrapper">
        <div class="glass-bottom-nav">
            <a href="/" class="nav-item spa-link {% if page_title == 'Home' or page_title == 'AnimeNest' %}active{% endif %}">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            
            <a href="/watchlist" class="nav-item spa-link {% if page_title == 'Watchlist' %}active{% endif %}">
                <i class="far fa-bookmark"></i>
                <span>Watchlist</span>
            </a>
            
            <a href="/continue-watching" class="nav-item spa-link {% if page_title == 'Continue Watching' %}active{% endif %}">
                <i class="fas fa-play-circle"></i>
                <span>Continue</span>
                <span class="nav-badge"></span>
            </a>
            
            <a href="/profile" class="nav-item spa-link {% if page_title == 'Profile' %}active{% endif %}">
                <i class="far fa-user"></i>
                <span>Profile</span>
            </a>
        </div>
    </div>

    <!-- Splash Screen Script & SPA Navigation -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splash = document.getElementById("splash-screen");
            if (!splash) return;
            if (sessionStorage.getItem('splashShown')) {
                splash.style.display = 'none';
            } else {
                sessionStorage.setItem('splashShown', 'true');
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => { splash.style.display = 'none'; }, 500);
                }, 1500);
            }
        });

        function openSearch() {
            document.getElementById('searchOverlay').classList.add('active');
            setTimeout(() => { document.getElementById('searchInput').focus(); }, 100);
        }
        function closeSearch() {
            document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeSearch(); } });

        function showSpaLoader() {
            const loader = document.getElementById('spaLoader');
            if (loader) {
                loader.style.width = '0%';
                loader.style.opacity = '1';
                setTimeout(() => { loader.style.width = '70%'; }, 50);
            }
        }
        function hideSpaLoader() {
            const loader = document.getElementById('spaLoader');
            if (loader) {
                loader.style.width = '100%';
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.width = '0%'; }, 300);
                }, 200);
            }
        }

        document.addEventListener('click', async function(e) {
            const link = e.target.closest('a');
            if (!link) return;
            const href = link.getAttribute('href');
            if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
            if (link.getAttribute('target') === '_blank') return;
            if (link.classList.contains('no-spa')) return;
            if (href.startsWith('/logout')) return;
            if (href.startsWith('/login')) return;

            e.preventDefault();
            showSpaLoader();

            try {
                const response = await fetch(href, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, credentials: 'same-origin' });
                if (!response.ok) throw new Error('Fetch failed');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newMain = doc.querySelector('main') || doc.querySelector('#spaContent');
                const oldMain = document.getElementById('spaContent');

                if (newMain && oldMain) {
                    oldMain.innerHTML = newMain.innerHTML;
                    const scripts = oldMain.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => {
                            newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    document.querySelectorAll('.nav-item').forEach(nav => {
                        nav.classList.remove('active');
                        if (nav.getAttribute('href') === href) nav.classList.add('active');
                    });
                } else {
                    window.location.href = href;
                }
            } catch (err) {
                window.location.href = href;
            } finally {
                hideSpaLoader();
            }
        });
    </script>
</body>
</html>
