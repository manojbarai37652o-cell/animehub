<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeNest - Watch Anime Free</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AnimeNest">
    <link rel="apple-touch-icon" href="/static/images/logo.png">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo">
            <span style="color: #ff4d4d; font-size: 50px; font-weight: 900;">A</span>
        </div>
        <div class="splash-spinner"></div>
        <p class="splash-text">Loading your anime...</p>
    </div>

    <!-- 🛠️ NEW: Floating Glass Header -->
    <div class="header-wrapper">
        <header class="glass-header">
            <div class="logo-left">
                <a href="/" class="logo-link">
                    <i class="fas fa-crown logo-crown"></i>
                    <span class="logo-text">AnimeNest</span>
                </a>
            </div>

            <div class="header-right-icons">
                <a href="javascript:void(0)" onclick="openSearch()" class="glass-icon-btn"><i class="fas fa-search"></i></a>
                <a href="#" class="glass-icon-btn bell-icon">
                    <i class="fas fa-bell"></i>
                    <span class="notification-dot"></span>
                </a>
                {% if session.user_pic %}
                <a href="/profile" class="glass-icon-btn profile-icon">
                    <img src="{{ session.user_pic }}" alt="Profile" class="user-avatar">
                </a>
                {% else %}
                <a href="/profile" class="glass-icon-btn"><i class="fas fa-user"></i></a>
                {% endif %}
            </div>
        </header>
    </div>

    <!-- Netflix Style Search Overlay -->
    <div id="searchOverlay" class="search-overlay">
        <div class="search-overlay-content">
            <form action="/search" method="GET" class="search-form-overlay">
                <i class="fas fa-search search-icon-overlay"></i>
                <input type="text" name="q" id="searchInput" placeholder="Search anime, movies..." autocomplete="off" required>
                <button type="button" class="close-search-btn" onclick="closeSearch()"><i class="fas fa-times"></i></button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 🛠️ NEW: Floating Glass Bottom Nav -->
    <div class="bottom-nav-wrapper">
        <div class="glass-bottom-nav">
            <a href="/" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="/trending" class="nav-item"><i class="fas fa-fire"></i><span>Trending</span></a>
            <a href="/categories" class="nav-item"><i class="fas fa-th-large"></i><span>Categories</span></a>
            <a href="/top-rated" class="nav-item"><i class="fas fa-crown"></i><span>Top Rated</span></a>
            <a href="/more" class="nav-item"><i class="fas fa-ellipsis-h"></i><span>More</span></a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const splash = document.getElementById("splash-screen");
            if (!splash) return;
            if (sessionStorage.getItem('splashShown')) {
                splash.style.display = 'none';
            } else {
                sessionStorage.setItem('splashShown', 'true');
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => { splash.style.display = 'none'; }, 500);
                }, 1000);
            }
        });

        function openSearch() {
            document.getElementById('searchOverlay').classList.add('active');
            setTimeout(() => { document.getElementById('searchInput').focus(); }, 100);
        }
        function closeSearch() {
            document.getElementById('searchOverlay').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeSearch(); } });
    </script>
</body>
</html>
