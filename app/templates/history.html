{% extends 'base.html' %}

{% block content %}
<div class="main-content-wrapper" style="padding: 20px 15px; padding-bottom: 100px;">

    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 22px; color: #fff;">🕒 Watch History</h2>
        <button onclick="clearWatchHistory()" style="background: rgba(255, 75, 43, 0.1); border: 1px solid rgba(255, 75, 43, 0.3); color: #ff4b2b; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600;">
            <i class="fas fa-trash"></i> Clear
        </button>
    </div>

    <div class="anime-row" id="historyContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px;">
        <!-- जावास्क्रिप्ट यहाँ हिस्ट्री लोड करेगा -->
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('historyContainer');
        // watch.html में हमने 'animeHistory' नाम से डेटा सेव किया था
        let historyData = JSON.parse(localStorage.getItem('animeHistory')) || [];

        if (historyData.length === 0) {
            container.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 40px 0; color: #888;">
                    <i class="fas fa-ghost" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i>
                    <h3>कोई हिस्ट्री नहीं मिली</h3>
                    <p>आपने अभी तक कोई एनीमे नहीं देखा है।</p>
                </div>
            `;
            return;
        }

        // हिस्ट्री कार्ड्स बनाना
        let htmlContent = '';
        historyData.forEach(anime => {
            htmlContent += `
                <a href="/watch/${anime.id}" class="anime-card" style="text-decoration: none;">
                    <div style="position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; margin-bottom: 8px;">
                        <img src="${anime.image}" alt="${anime.title}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://via.placeholder.com/150x220?text=No+Image';">
                    </div>
                    <h3 class="anime-title" style="font-size: 13px; margin: 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${anime.title}</h3>
                </a>
            `;
        });
        
        container.innerHTML = htmlContent;
    });

    // हिस्ट्री क्लियर करने का फंक्शन
    function clearWatchHistory() {
        if (confirm("क्या आप सच में अपनी पूरी हिस्ट्री डिलीट करना चाहते हैं?")) {
            localStorage.removeItem('animeHistory');
            location.reload(); // पेज को रिफ्रेश करो
        }
    }
</script>
{% endblock %}
