<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AnimeHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <span style="color: #ff4d4d; font-size: 40px;">M</span>AG ANIME
            </div>
            <h2>Welcome Back!</h2>
            <p>Sign in to watch your favourite anime</p>
            
            <a href="/login/google" class="google-btn">
                <i class="fab fa-google"></i> Continue with Google
            </a>
            
            <a href="/guest" class="guest-btn">
                <i class="fas fa-eye"></i> Preview Mode (Team)
            </a>

            <p class="login-footer">By signing in, you agree to our Terms & Privacy Policy</p>
        </div>
    </div>
</body>
</html>
