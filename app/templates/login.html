<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome - AnimeNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">

    <div class="login-container">
        <div class="login-bg-overlay"></div>
        <div class="login-content">
            
            <div class="login-logo">
                <span class="logo-a">A</span><span class="logo-text">NIMENEST</span>
                <p class="logo-sub">YOUR ANIME HOME</p>
            </div>

            <h1 class="welcome-title">Welcome to AnimeNest!</h1>
            <p class="welcome-sub">Enjoy watching your favourite anime for free.</p>

            <!-- 🛠️ सीधा होम पेज पर जाने का बटन (बिना लॉगिन) -->
            <a href="/" class="btn-signin" style="display: flex; justify-content: center; align-items: center; text-decoration: none; margin-top: 30px; background: linear-gradient(135deg, #a855f7, #6366f1); color: white; padding: 15px; border-radius: 12px; font-weight: 600; font-size: 16px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);">
                Continue to Home <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </a>

            <div class="login-footer" style="margin-top: 40px;">
                <p>アニメは永遠だ</p>
                <div class="footer-line"></div>
            </div>

        </div>
    </div>

</body>
</html>
