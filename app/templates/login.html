<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - AnimeNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">

    <div class="login-container">
        <div class="login-bg-overlay"></div>
        <div class="login-content">
            
            <!-- Logo Section -->
            <div class="login-logo">
                <span class="logo-a">A</span><span class="logo-text">NIMENEST</span>
                <p class="logo-sub">YOUR ANIME HOME</p>
            </div>

            <!-- Welcome Text -->
            <h1 class="welcome-title">Welcome Back!</h1>
            <p class="welcome-sub">Sign in to watch your favourite anime</p>

            <!-- 🛠️ FIX: असली ईमेल/पासवर्ड वाला फॉर्म -->
            <form class="login-form" action="/login/email" method="POST">
                {% if error %}
                <p style="color: #ff4d4d; font-size: 0.8rem; text-align: center; margin-bottom: 10px;">{{ error }}</p>
                {% endif %}
                
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" placeholder="Password" required id="passwordInput">
                    <i class="fas fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-signin">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Social Logins -->
            <a href="/login" class="social-btn google-btn">
                <i class="fab fa-google" style="color: #db4437;"></i> Continue with Google
            </a>
            <a href="#" class="social-btn discord-btn" onclick="alert('Discord लॉगिन जल्द ही आ रहा है!')">
                <i class="fab fa-discord" style="color: #5865F2;"></i> Continue with Discord
            </a>

            <!-- Sign Up -->
            <p class="signup-text">Don't have an account? <a href="/signup">Sign Up</a></p>

            <!-- Japanese Footer -->
            <div class="login-footer">
                <p>アニメは永遠だ</p>
                <div class="footer-line"></div>
            </div>

        </div>
    </div>

    <script>
        function togglePassword() {
            var input = document.getElementById("passwordInput");
            var icon = document.querySelector(".toggle-password");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        }
    </script>
</body>
</html>
