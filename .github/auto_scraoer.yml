name: Auto Anime Scraper

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium
      
      - name: Run Scraper
        run: python scraper/smart_scraper.py
      
      - name: Save Data to GitHub
        run: |
          git config --local user.email "bot@animehub.com"
          git config --local user.name "AnimeHub Bot"
          git add database/storage.json database/progress.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-scraped new anime"
          git push